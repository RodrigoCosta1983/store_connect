<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Store & Connect - Plataforma de Gestão Multi-Loja">

    <meta name="google-signin-client_id" content="294766590074-s5uc0aaaege2em5vsg8j5mimih6at2i1.apps.googleusercontent.com">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="icon" type="image/png" href="icons/Icon_512.png"/>

    <title>Store & Connect</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
<script>
    // Estes comandos entre chaves {{ }} são usados pelo Flutter na hora do build
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {

        // 1. DETECÇÃO: Verifica se é iPhone, iPad ou iPod
        let isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        // 2. INICIALIZAÇÃO HÍBRIDA:
        // Se for iOS -> Usa "html" (evita tela branca)
        // Se for Android/PC -> Usa "auto" (mantém a qualidade máxima que você gostou)
        const appRunner = await engineInitializer.initializeEngine({
          renderer: isIos ? "html" : "auto"
        });

        await appRunner.runApp();
      }
    });
</script>
</body>
</html>
